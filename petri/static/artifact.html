<style>
/* Layout: full-bleed 3D canvas (one deliberate dark "lab bench" look); a slim top bar and a bottom control sheet float over it. */
:root {
  color-scheme: dark;
  --bg: #0e1218; --panel: rgba(20, 26, 35, 0.92); --line: #2a3442; --fg: #e4e8ee; --muted: #8b96a6;
  --pos: #f29e38; --neg: #4f9fe0; --dock: #ec5c9e; --accent: #ec5c9e;
  --display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
  --body: "Inter", ui-sans-serif, system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--body); overflow: hidden; }
#app { position: fixed; inset: 0; }
#c, #num { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#c { touch-action: none; }
#num, #labels { pointer-events: none; }
#labels { position: absolute; inset: 0; }
.lbl { position: absolute; transform: translate(-50%, -100%); font: 500 12px var(--display); color: var(--muted);
  white-space: nowrap; letter-spacing: 0.02em; text-shadow: 0 1px 3px var(--bg); }
.lbl.hot { color: var(--fg); }
header#top { position: absolute; top: 0; left: 0; right: 0; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px); padding-bottom: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(var(--bg), rgba(14, 18, 24, 0)); }
.brand { font: 600 17px var(--display); letter-spacing: 0.01em; }
.brand small { font: 400 12px var(--mono); color: var(--muted); margin-left: 6px; }
select, input[type=text], button { font: 500 13px var(--body); color: var(--fg); background: #1a212c; border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 10px; }
button { cursor: pointer; }
button:hover { border-color: var(--muted); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
#custom { min-width: 0; flex: 1 1 220px; }
#numbers[aria-pressed="true"], #flow[aria-pressed="true"] { border-color: var(--accent); }
#status { font: 12px var(--mono); color: var(--muted); }
#status.err { color: var(--pos); }
section#panel { position: absolute; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line);
  padding-top: 8px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 8px; backdrop-filter: blur(6px);
  /* Expanded on a phone it can be taller than the screen; the page itself never scrolls, so the panel does. */
  max-height: 75vh; max-height: 75dvh; overflow-y: auto; overscroll-behavior: contain; }
#tokens { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.tok { flex: none; font: 12px var(--mono); padding: 3px 6px; border-radius: 4px; background: #1a212c; border: 1px solid var(--line); color: var(--fg); }
.tok.after { opacity: 0.35; }
.tok.sel { border-color: var(--accent); color: #fff; background: #3a1f2e; }
.ctrl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.ctrl .grp { display: flex; gap: 6px; align-items: center; }
#layer { width: min(260px, 40vw); accent-color: var(--accent); }
.num { font: 13px var(--mono); font-variant-numeric: tabular-nums; min-width: 2.2em; display: inline-block; }
#steps { display: flex; gap: 4px; flex-wrap: wrap; }
#steps button { padding: 4px 7px; font: 11px var(--mono); }
#steps button.on, #headPick button.on { border-color: var(--accent); color: #fff; background: #3a1f2e; }
.info { display: grid; gap: 4px; max-width: 72ch; }
.info h2 { margin: 0; font: 600 15px var(--display); text-wrap: balance; }
#plain { margin: 0; color: var(--fg); font-size: 14px; }
#tech { margin: 0; color: #aab3c0; font-size: 12px; }
#tech::before { content: "Technical: "; color: var(--muted); font-weight: 500; }
#headPick { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
#headPick button { padding: 3px 7px; font: 11px var(--mono); }
#stats { font: 12px/1.5 var(--mono); color: var(--fg); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
#stats b { color: var(--dock); font-weight: 400; }
#stats .ok { color: #7fd18b; }
#tip { position: absolute; pointer-events: none; font: 12px var(--mono); background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 8px; max-width: 260px; }
details#about { font-size: 12px; color: var(--muted); }
details#about summary { cursor: pointer; }
details#about div { max-width: 72ch; padding-top: 4px; display: grid; gap: 3px; }
#panel.compact #tech, #panel.compact #about { display: none; }
#panel.compact .info h2 { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#panel.compact #plain { font-size: 13px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
#panel.compact #stats { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
#track { font: 12px/1.5 var(--mono); color: var(--fg); background: #2a2230; border: 1px solid var(--accent); border-radius: 6px; padding: 4px 8px; }
#track .dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; background: #fff0f8; box-shadow: 0 0 6px var(--accent); margin-right: 6px; vertical-align: 0; }
#track button { padding: 0 6px; margin-left: 6px; font-size: 12px; }
@media (max-width: 640px) {
  .brand small { display: none; }
  .brand { font-size: 15px; }
  header#top { gap: 6px 8px; padding-top: calc(env(safe-area-inset-top, 0px) + 6px); padding-bottom: 4px; }
  header#top select, header#top button { padding: 4px 8px; }
  #status.ok { display: none; }
  section#panel { gap: 6px; padding-top: 6px; }
  .ctrl { gap: 6px 8px; }
  .ctrl button { padding: 4px 9px; }
  #steps button { padding: 3px 6px; }
  #layer { width: 34vw; }
}
</style>

<div id="app">
  <canvas id="c" aria-label="3D view of one transformer layer"></canvas>
  <canvas id="num" aria-hidden="true"></canvas>
  <div id="labels"></div>
  <div id="tip" hidden></div>
  <header id="top">
    <div class="brand">Petri Dish<small>SmolLM2-135M · docking</small></div>

</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);

// ---------- data files (petri/trace.py pack_arrays) ----------
const F16 = new Float32Array(65536);       // float16 bit pattern -> value
for (let u = 0; u < 65536; u++) {

const DT = { int8: Int8Array, uint8: Uint8Array, uint16: Uint16Array, int16: Int16Array, float16: Uint16Array, float32: Float32Array, int32: Int32Array };
function parsePack(buf) {

  const hlen = new DataView(buf).getUint32(4, true);
  const h = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 8, hlen)));

  for (const [name, s] of Object.entries(h.sections)) a[name] = new DT[s.dtype](buf, base + s.offset, s.shape.reduce((x, y) => x * y, 1));

  const b64 = /\.b64\.txt(\?|$)/.test(r.url);

// Colour scale: the 98th percentile of |v|, so a few giant outlier values saturate instead of washing out the rest.
function robust(v) { const a = Array.from(v, Math.abs).sort((x, y) => x - y); return a[Math.floor((a.length - 1) * 0.98)] || a[a.length - 1] || 1; }

// ---------- scene ----------
const canvas = $('#c');

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.5, 3000);
scene.add(new THREE.AmbientLight(0xffffff, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.8); sun.position.set(-30, 50, 80); scene.add(sun);

const C3 = hex => { const c = new THREE.Color(hex); return [c.r, c.g, c.b]; };
const NEUTRAL = C3('#29313d'), POS = C3('#f29e38'), NEG = C3('#4f9fe0'), DOCK = C3('#ec5c9e'), UNDOCK = C3('#3a4352'),
      MARK = C3('#aab3c0'), SEL = C3('#ffffff'), SLAB = C3('#262e3a');

  const a = Math.pow(Math.min(1, Math.abs(t)), 0.7), tg = t >= 0 ? POS : NEG;
  return [NEUTRAL[0] + (tg[0] - NEUTRAL[0]) * a, NEUTRAL[1] + (tg[1] - NEUTRAL[1]) * a, NEUTRAL[2] + (tg[2] - NEUTRAL[2]) * a];

const headColor = h => { const c = new THREE.Color().setHSL(h / 9, 0.7, 0.62); return [c.r, c.g, c.b]; };

let selIdx = -1;     // tracked position (0..575), or -1
class Group {

    this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.mesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(n * 3), 3);
    this.mesh.frustumCulled = false;
    for (const k of ['cur', 'from', 'to']) this[k] = { p: new Float32Array(n * 3), s: new Float32Array(n * 3), c: new Float32Array(n * 3) };
    this.t0 = 0; this.dur = 0; this.anim = false;
    scene.add(this.mesh);
  }
  set(i, p, s, c) {           // target for instance i; s = scalar or [sx, sy, sz]; c = [r, g, b] or null (keep)
    const T = this.to, j = i * 3;
    T.p[j] = p[0]; T.p[j + 1] = p[1]; T.p[j + 2] = p[2];
    if (typeof s === 'number') { T.s[j] = T.s[j + 1] = T.s[j + 2] = s; } else { T.s[j] = s[0]; T.s[j + 1] = s[1]; T.s[j + 2] = s[2]; }
    if (c) { T.c[j] = c[0]; T.c[j + 1] = c[1]; T.c[j + 2] = c[2]; }
  }
  hideAll() { this.to.s.fill(0); }
  begin(dur, now) {
    this.from.p.set(this.cur.p); this.from.s.set(this.cur.s); this.from.c.set(this.cur.c);
    this.t0 = now; this.dur = dur; this.anim = true;

  }

    const m = new THREE.Matrix4(), P = this.cur.p, S = this.cur.s, Cc = this.cur.c, sel = selIdx >= 0;
    for (let i = 0; i < this.n; i++) {

const G = {
  R: new Group(576, 0.8), Q: new Group(576, 0.8), K: new Group(192, 0.8), V: new Group(192, 0.8),
  TK: new Group(96, 1), B: new Group(48, 1), F: new Group(576, 0.8),
  EB: new Group(48, 1),                                            // embedding table, drawn as 48 slabs
  NW: new Group(576, 0.8), NP: new Group(576, 0.8), NS: new Group(2, 0.8),   // inside-a-head demo
  GN: new Group(576, 0.8),                                         // the evening-out multipliers (RMSNorm gain)
};
for (const [k, g] of Object.entries(G)) { g.name = k; g.linked = ['R', 'Q', 'F', 'GN', 'NW', 'NP'].includes(k); g.write(); }

// Curved lines (attention arcs, docking links, projection beams) with per-vertex alpha.
const MAXV = 40000;
const lineGeo = new THREE.BufferGeometry();

// cam(ph): [centre x, width to fit, centre y, height to fit]. phases: sub-steps played in order, gap ms apart.

const heads = new THREE.InstancedMesh(new THREE.ConeGeometry(0.8, 2.2, 14), flowMat, MAXF);

    const gi = Math.floor(i / 64);
    txt = `${PICK[name]} block ${gi} (shared by question blocks ${gi * 3}–${gi * 3 + 2}), number ${i % 64} = ${f3(g.vals[i])}`;
  } else txt = `${PICK[name] || 'value'} #${i} = ${f3(g.vals[i])}`;
  tip.textContent = txt; tip.hidden = false;
  tip.style.left = Math.min(e.clientX + 12, innerWidth - 270) + 'px'; tip.style.top = Math.max(e.clientY - 40, 8) + 'px';
}

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); dirty = true;
}
addEventListener('resize', resize);
const v3 = new THREE.Vector3();
function frame(now) {
  for (const g of Object.values(G)) if (g.step(now)) dirty = true;
  if (updatePulses(now)) dirty = true;
  const k = Math.min(1, (now - camT0) / 700), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
  if (k < 1) dirty = true;
  camCur = camFrom.map((a, j) => a + (camTo[j] - a) * e);
  const lk = Math.min(1, (now - lineFade.t0) / 500);
  lineMat.opacity = lineFade.from + (lineFade.to - lineFade.from) * lk; if (lk < 1) dirty = true;
  if (dirty) {
    const panelH = $('#panel').offsetHeight, topH = $('#top').offsetHeight, H = canvas.clientHeight, visH = Math.max(H - panelH - topH, 120);
    const vf = THREE.MathUtils.degToRad(camera.fov) / 2, hf = Math.atan(Math.tan(vf) * camera.aspect);
    const dist = Math.max(camCur[1] / 2 / Math.tan(hf), (camCur[3] / 2 / Math.tan(vf)) * (H / visH)) * zoom;
    lastDist = dist;
    // shift the target so the scene sits in the space between the top bar and the panel; pan is the viewer's own offset
    const yShift = -(((panelH - topH) / 2) / H) * 2 * Math.tan(vf) * dist;
    const tx = camCur[0] + pan.x, ty = camCur[2] + yShift + pan.y, tz = pan.z;
    camera.position.set(tx + dist * Math.sin(theta) * Math.cos(phi), ty + dist * Math.sin(phi), tz + dist * Math.cos(theta) * Math.cos(phi));
    camera.lookAt(tx, ty, tz);
    camera.updateMatrixWorld();
    renderer.render(scene, camera);
    drawNumbers(H, panelH, topH, vf);
    const Wd = canvas.clientWidth, key = tr ? STEPS[step].key : '';
    for (const L of LABELS) {
      const on = tr && L.keys.includes(key) && !(L.minPh && L.minPh[key] > phase) && !(L.maxPh && L.maxPh[key] < phase) && !overview;
      if (!on) { L.el.style.display = 'none'; continue; }
      const p = L.p();
      v3.set(p[0], p[1], p[2]).project(camera);
      if (v3.z > 1) { L.el.style.display = 'none'; continue; }
      if (L.text) L.el.textContent = L.text();
      L.el.style.display = ''; L.el.style.left = ((v3.x + 1) / 2) * Wd + 'px'; L.el.style.top = ((1 - v3.y) / 2) * H + 'px';
    }
    dirty = false;
  }
  requestAnimationFrame(frame);
}

// ---------- numbers on the cubes: a 2D layer over the scene, only for cubes large enough to read ----------
const numCv = $('#num'), nctx = numCv.getContext('2d'), wp = new THREE.Vector3();
let numbersOn = true, lastFont = '';
const fmtV = v => { const a = Math.abs(v); return a >= 100 ? v.toFixed(0) : a >= 10 ? v.toFixed(1) : v.toFixed(2); };
function drawNumbers(H, panelH, topH, vf) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2), Wd = canvas.clientWidth;
  if (numCv.width !== Math.round(Wd * dpr) || numCv.height !== Math.round(H * dpr)) { numCv.width = Math.round(Wd * dpr); numCv.height = Math.round(H * dpr); lastFont = ''; }
  nctx.setTransform(dpr, 0, 0, dpr, 0, 0); nctx.clearRect(0, 0, Wd, H);
  if (!numbersOn || !tr) return;
  nctx.textAlign = 'center'; nctx.textBaseline = 'middle';
  const k = H / (2 * Math.tan(vf)), limitY = H - panelH;
  for (const [g, unit] of [[G.R, ''], [G.Q, ''], [G.K, ''], [G.V, ''], [G.F, ''], [G.B, '%'], [G.GN, ''], [G.NW, ''], [G.NP, ''], [G.NS, '']]) {
    const P = g.cur.p, S = g.cur.s, Cc = g.cur.c;
    for (let i = 0; i < g.n; i++) {
      const j = i * 3;
      if (S[j] < 0.6) continue;
      wp.set(P[j], P[j + 1], P[j + 2] + (S[j + 2] * g.size) / 2 + 0.01);      // centre of the front face
      const px = (g.size * S[j] * k) / wp.distanceTo(camera.position);       // cube width on screen
      if (px < 24) continue;
      v3.copy(wp).project(camera);
      if (v3.z > 1 || Math.abs(v3.x) > 1.05 || Math.abs(v3.y) > 1.05) continue;
      const x = ((v3.x + 1) / 2) * Wd, y = ((1 - v3.y) / 2) * H;
      if (y > limitY || y < topH) continue;                                   // keep clear of the top bar and the panel
      const txt = fmtV(g.vals[i]) + unit;
      const fs = Math.min((px * 0.9) / Math.max(txt.length * 0.6, 2.4), px * 0.42);
      if (fs < 7) continue;
      const font = `${fs.toFixed(0)}px "JetBrains Mono", ui-monospace, monospace`;
      if (font !== lastFont) { nctx.font = font; lastFont = font; }
      nctx.fillStyle = 0.299 * Cc[j] + 0.587 * Cc[j + 1] + 0.114 * Cc[j + 2] > 0.45 ? '#111418' : '#f2f4f7';
      nctx.globalAlpha = selIdx >= 0 && !(g.linked && i === selIdx) ? 0.3 : 1;   // tracking dims the other numbers
      nctx.fillText(txt, x, y);
    }
  }
  nctx.globalAlpha = 1;
  // The tracked position: a label above its cube in every linked group, readable at any zoom.
  if (selIdx >= 0) for (const g of [G.R, G.Q, G.F, G.GN, G.NW, G.NP]) {
    const j = selIdx * 3;
    if (g.cur.s[j] < 0.3) continue;
    wp.set(g.cur.p[j], g.cur.p[j + 1] + g.size * 0.9, g.cur.p[j + 2] + (g.cur.s[j + 2] * g.size) * 0.75);
    v3.copy(wp).project(camera);
    if (v3.z > 1 || Math.abs(v3.x) > 1.05 || Math.abs(v3.y) > 1.05) continue;
    const x = ((v3.x + 1) / 2) * Wd, y = ((1 - v3.y) / 2) * H;
    if (y > limitY || y < topH) continue;
    const txt = f3(g.vals[selIdx]);
    nctx.font = '600 12px "JetBrains Mono", ui-monospace, monospace'; lastFont = '';
    const w = nctx.measureText(txt).width + 12;
    nctx.fillStyle = 'rgba(42, 34, 48, 0.94)'; nctx.strokeStyle = '#ec5c9e'; nctx.lineWidth = 1;
    nctx.beginPath(); nctx.roundRect(x - w / 2, y - 20, w, 18, 4); nctx.fill(); nctx.stroke();
    nctx.fillStyle = '#ffffff'; nctx.fillText(txt, x, y - 11);
  }
}
$('#numbers').onclick = () => { numbersOn = !numbersOn; $('#numbers').setAttribute('aria-pressed', numbersOn); dirty = true; };
$('#flow').onclick = () => { flowOn = !flowOn; $('#flow').setAttribute('aria-pressed', flowOn); if (tr) setFlows(flowsFor(step, phase)); dirty = true; };

// Compact panel: phones start with tokens, controls, a one-line title and the plain explanation.
function setCompact(on) {
  $('#panel').classList.toggle('compact', on);
  $('#detail').setAttribute('aria-expanded', !on); $('#detail').textContent = on ? 'Details' : 'Less';
  dirty = true;
}
$('#detail').onclick = () => setCompact(!$('#panel').classList.contains('compact'));
setCompact(matchMedia('(max-width: 640px)').matches);
resize(); requestAnimationFrame(frame); init();
})();
</script>
