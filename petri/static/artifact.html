<meta charset="utf-8">
<title>Petri Dish</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: full-bleed 3D canvas (one deliberate dark "lab bench" look); a slim top bar and a bottom control sheet float over it. */
:root {
  color-scheme: dark;
  --bg: #0e1218; --panel: rgba(20, 26, 35, 0.92); --line: #2a3442; --fg: #e4e8ee; --muted: #8b96a6;
  --pos: #f29e38; --neg: #4f9fe0; --dock: #ec5c9e; --accent: #ec5c9e;
  --display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
  --body: "Inter", ui-sans-serif, system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--body); overflow: hidden; }
#app { position: fixed; inset: 0; }
#c, #num { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#c { touch-action: none; }
#num, #labels { pointer-events: none; }
#labels { position: absolute; inset: 0; }
.lbl { position: absolute; transform: translate(-50%, -100%); font: 500 12px var(--display); color: var(--muted);
  white-space: nowrap; letter-spacing: 0.02em; text-shadow: 0 1px 3px var(--bg); }
.lbl.hot { color: var(--fg); }
.lbl.rside { transform: translate(-100%, -50%); }   /* ends at its point: the text going into the tokenizer */
.lbl.side { transform: translate(0, -50%); }     /* starts at its point and reads to the right: captions beside a block */
/* the card beside the dial: a few short paragraphs, right edge at its point; the one playing now is bright */
.lbl.card { transform: translate(calc(-100% - 22px), -50%); white-space: normal; width: min(390px, 44vw); font: 400 13px/1.5 var(--body);
  letter-spacing: 0; color: var(--muted); text-shadow: none; background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 10px 13px; }
.lbl.card p { margin: 0 0 7px; } .lbl.card p:last-child { margin-bottom: 0; }
.lbl.card p.now { color: var(--fg); } .lbl.card b { color: var(--fg); font-weight: 600; }
.lbl.card .ka { color: #f2c14e; font-weight: 600; } .lbl.card .kb { color: #5fd3b3; font-weight: 600; }
.lbl.card p.tip { font-family: var(--mono); font-size: 12px; color: var(--fg); }
header#top { position: absolute; top: 0; left: 0; right: 0; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px); padding-bottom: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(var(--bg), rgba(14, 18, 24, 0)); }
.brand { font: 600 17px var(--display); letter-spacing: 0.01em; }
.brand small { font: 400 12px var(--mono); color: var(--muted); margin-left: 6px; }
select, input[type=text], button { font: 500 13px var(--body); color: var(--fg); background: #1a212c; border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 10px; }
button { cursor: pointer; }
button:hover { border-color: var(--muted); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
#custom { min-width: 0; flex: 1 1 220px; }
#numbers[aria-pressed="true"], #flow[aria-pressed="true"] { border-color: var(--accent); }
#status { font: 12px var(--mono); color: var(--muted); }
#status.err { color: var(--pos); }
section#panel { position: absolute; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line);
  padding-top: 8px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 8px; backdrop-filter: blur(6px);
  /* Expanded on a phone it can be taller than the screen; the page itself never scrolls, so the panel does. */
  max-height: 75vh; max-height: 75dvh; overflow-y: auto; overscroll-behavior: contain; }
#tokens { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.tok { flex: none; font: 12px var(--mono); padding: 3px 6px; border-radius: 4px; background: #1a212c; border: 1px solid var(--line); color: var(--fg); }
.tok.after { opacity: 0.35; }
.tok.sel { border-color: var(--accent); color: #fff; background: #3a1f2e; }
.ctrl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
/* Progress through the current step, like a video bar: one segment per part (chapters), drag to scrub. */
#seekRow { display: flex; align-items: center; gap: 10px; }
#play { width: 36px; height: 30px; padding: 0; font-size: 14px; line-height: 1; flex: none; }
#seek { position: relative; flex: 1; height: 20px; cursor: pointer; touch-action: none; }
#seekSegs { position: absolute; left: 0; right: 0; top: 8px; height: 4px; display: flex; gap: 2px; transition: top 0.1s, height 0.1s; }
.sg.chap { margin-left: 5px; }
#seek:hover #seekSegs, #seek.drag #seekSegs { top: 7px; height: 6px; }
.sg { position: relative; flex: 1 1 0; min-width: 4px; background: rgba(255, 255, 255, 0.2); border-radius: 1px; overflow: hidden; }
.sg i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--accent); }
#seekThumb { position: absolute; top: 4px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--accent);
  pointer-events: none; transform: scale(0.8); transition: transform 0.1s; }
#seek:hover #seekThumb, #seek.drag #seekThumb { transform: scale(1.1); }
#seekTip { position: absolute; bottom: 22px; transform: translateX(-50%); font: 11px var(--mono); background: #1a212c; color: var(--fg);
  border: 1px solid var(--line); padding: 2px 6px; border-radius: 4px; white-space: nowrap; pointer-events: none; }
#seekTime { font-size: 11px; color: var(--muted); min-width: 7.5em; text-align: right; }
.ctrl .grp { display: flex; gap: 6px; align-items: center; }
#layer { width: min(260px, 40vw); accent-color: var(--accent); }
.num { font: 13px var(--mono); font-variant-numeric: tabular-nums; min-width: 2.2em; display: inline-block; }
#steps { display: flex; gap: 4px; flex-wrap: wrap; }
#steps button { padding: 4px 7px; font: 11px var(--mono); }
#steps button.on, #headPick button.on { border-color: var(--accent); color: #fff; background: #3a1f2e; }
.info { display: grid; gap: 4px; max-width: 72ch; }
.info h2 { margin: 0; font: 600 15px var(--display); text-wrap: balance; }
#plain { margin: 0; color: var(--fg); font-size: 14px; }
#tech { margin: 0; color: #aab3c0; font-size: 12px; }
#tech::before { content: "Technical: "; color: var(--muted); font-weight: 500; }
#headPick { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
#headPick button { padding: 3px 7px; font: 11px var(--mono); }
#stats { font: 12px/1.5 var(--mono); color: var(--fg); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
#stats b { color: var(--dock); font-weight: 400; }
#stats .ok { color: #7fd18b; }
#tip { position: absolute; pointer-events: none; font: 12px var(--mono); background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 8px; max-width: 260px; }
details#about { font-size: 12px; color: var(--muted); }
details#about summary { cursor: pointer; }
details#about div { max-width: 72ch; padding-top: 4px; display: grid; gap: 3px; }
#panel.compact #tech, #panel.compact #about { display: none; }
#panel.compact .info h2 { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#panel.compact #plain { font-size: 13px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
#panel.compact #stats { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
#track { font: 12px/1.5 var(--mono); color: var(--fg); background: #2a2230; border: 1px solid var(--accent); border-radius: 6px; padding: 4px 8px; }
#track .dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; background: #fff0f8; box-shadow: 0 0 6px var(--accent); margin-right: 6px; vertical-align: 0; }
#track button { padding: 0 6px; margin-left: 6px; font-size: 12px; float: right; }
#track ol.steps { margin: 4px 0 0; padding-left: 22px; }
#track ol.steps li { padding: 2px 4px; border-radius: 4px; color: var(--muted, #aaa); }
#track ol.steps li.now { background: #3a2a40; color: var(--fg); }
#track ol.steps .sn { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; opacity: .75; }
#track ol.steps b { color: #fff0f8; }
#track ol.steps i { display: block; font-style: normal; font-size: 11px; opacity: .65; }
/* Fullscreen: the canvas gets the screen; the panel keeps the tokens and the player; the explanation lives in a drawer
   on the right, pulled out by its tab. Outside fullscreen the drawer is not there at all. */
#drawer { display: none; }
#app.fs #drawer { display: block; position: absolute; top: 0; right: 0; bottom: 0; width: min(400px, 86vw); z-index: 5;
  background: var(--panel); border-left: 1px solid var(--line); backdrop-filter: blur(6px);
  transform: translateX(100%); transition: transform 0.28s ease; }
#app.fs #drawer.open { transform: none; }
#drawerTab { position: absolute; left: -30px; top: 50%; width: 30px; height: 92px; margin-top: -46px; padding: 0;
  border-radius: 6px 0 0 6px; border-right: none; writing-mode: vertical-rl; transform: rotate(180deg); font: 600 12px var(--display);
  letter-spacing: 0.08em; background: var(--panel); }
#drawerBody { height: 100%; overflow-y: auto; overscroll-behavior: contain; display: grid; align-content: start; gap: 10px;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) max(16px, env(safe-area-inset-right, 0px)) 16px 16px; }
#app.fs #drawer .info { max-width: none; }
#fs[aria-pressed="true"] { border-color: var(--accent); }
@media (max-width: 640px) {
  .brand small { display: none; }
  .brand { font-size: 15px; }
  header#top { gap: 6px 8px; padding-top: calc(env(safe-area-inset-top, 0px) + 6px); padding-bottom: 4px; }
  header#top select, header#top button { padding: 4px 8px; }
  #status.ok { display: none; }
  section#panel { gap: 6px; padding-top: 6px; }
  .ctrl { gap: 6px 8px; }
  .ctrl button { padding: 4px 9px; }
  #steps button { padding: 3px 6px; }
  #layer { width: 34vw; }
}
</style>

<div id="app">
  <canvas id="c" aria-label="3D view of one transformer layer"></canvas>
  <canvas id="num" aria-hidden="true"></canvas>
  <div id="labels"></div>
  <div id="tip" hidden></div>
  <header id="top">
    <div class="brand">Petri Dish<small>SmolLM2-135M · docking</small></div>
    <select id="prompt" aria-label="Sample prompt"></select>
    <input id="custom" class="live-only" type="text" placeholder="Trace your own prompt (live only)" hidden>
    <button id="run" class="live-only" hidden>Trace</button>
    <button id="overview" title="Show the whole layer">Whole layer</button>
    <button id="numbers" aria-pressed="true" title="Print values on cubes large enough to read; zoom in to see more">Numbers</button>
    <button id="flow" aria-pressed="true" title="Arrows showing which way values move in this step">Flow</button>
    <button id="fs" aria-pressed="false" title="Fullscreen (f): the explanation moves to a pull-out tab on the side">⛶</button>
    <span id="status">loading…</span>
  </header>
  <section id="panel">
    <div id="tokens" role="listbox" aria-label="Token to follow"></div>
    <div id="seekRow">
      <button id="play" aria-label="Play" title="Play / pause (space) · , and . step one frame">▶</button>
      <div id="seek" role="slider" aria-label="Position in this step: drag to scrub; , and . step one stage" tabindex="0">
        <div id="seekSegs"></div><div id="seekThumb"></div><div id="seekTip" hidden></div>
      </div>
      <span id="seekTime" class="num">0:00 / 0:00</span>
    </div>
    <div class="ctrl">
      <div class="grp">
        <button id="prev" aria-label="Previous part" title="Previous part (←)">⏮</button>
        <button id="next" aria-label="Next part" title="Next part (→)">⏭</button>
        <button id="detail" aria-expanded="true" aria-controls="panel">Less</button>
      </div>
      <div class="grp"><label for="layer">Layer</label><input id="layer" type="range" min="0" max="29" value="0"><span class="num" id="layerNum">1/30</span></div>
      <div id="steps"></div>
    </div>
    <div class="info">
      <h2 id="stepTitle"></h2>
      <p id="plain"></p>
      <div id="headPick" hidden></div>
      <div id="track" hidden></div>
      <div id="stats"></div>
      <p id="tech"></p>
    </div>
    <details id="about">
      <summary>About this trace</summary>
      <div id="aboutBody"></div>
    </details>
  </section>
  <!-- fullscreen: the explanation (.info, #about) is moved in here, a drawer pulled out by its tab -->
  <aside id="drawer" aria-label="Explanation">
    <button id="drawerTab" aria-expanded="false" aria-controls="drawer" title="Show or hide the explanation">text</button>
    <div id="drawerBody"></div>
  </aside>
</div>

<script>window.THREE || document.write('<script src="vendor/three-0.159.0.min.js"><\/script>');</script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const status = (msg, err, ok) => { const s = $('#status'); s.textContent = msg; s.classList.toggle('err', !!err); s.classList.toggle('ok', !!ok); };
if (!window.THREE) { status('three.js did not load', true); return; }

// ---------- data files (petri/trace.py pack_arrays) ----------
const F16 = new Float32Array(65536);       // float16 bit pattern -> value
for (let u = 0; u < 65536; u++) {
  const s = u & 0x8000 ? -1 : 1, e = (u >> 10) & 31, f = u & 1023;
  F16[u] = e === 0 ? s * f * 2 ** -24 : e === 31 ? (f ? NaN : s * Infinity) : s * 2 ** (e - 15) * (1 + f / 1024);
}
const DT = { int8: Int8Array, uint8: Uint8Array, uint16: Uint16Array, int16: Int16Array, float16: Uint16Array, float32: Float32Array, int32: Int32Array };
function parsePack(buf) {
  if (String.fromCharCode(...new Uint8Array(buf, 0, 4)) !== 'PTRI') throw new Error('not a petri file');
  const hlen = new DataView(buf).getUint32(4, true);
  const h = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 8, hlen)));
  const base = 8 + hlen, a = {};
  for (const [name, s] of Object.entries(h.sections)) a[name] = new DT[s.dtype](buf, base + s.offset, s.shape.reduce((x, y) => x * y, 1));
  return { h, a };
}
async function fetchPack(fetcher) {
  const r = await fetcher();
  if (!r.ok) { let m = r.statusText; try { m = (await r.json()).error; } catch (_) {} throw new Error(m); }
  // The artifact host serves no binary types, so the static build ships these as base64 text.
  const b64 = /\.b64\.txt(\?|$)/.test(r.url);
  return parsePack(b64 ? Uint8Array.from(atob((await r.text()).trim()), ch => ch.charCodeAt(0)).buffer : await r.arrayBuffer());
}
// n values of vector number idx in a section, as floats (float16 sections, or int8/int16 with one scale per vector)
function vecOf(P, name, idx, n) {
  const arr = P.a[name], out = new Float32Array(n), o = idx * n;
  if (P.h.sections[name].dtype === 'float16') for (let i = 0; i < n; i++) out[i] = F16[arr[o + i]];
  else { const s = P.a[name + '_scale'][idx]; for (let i = 0; i < n; i++) out[i] = arr[o + i] * s; }
  return out;
}
const deq = (name, l, t, n, g = 0, heads = 1) => vecOf(tr, name, (l * tr.T + t) * heads + g, n);
// Colour scale: the 98th percentile of |v|, so a few giant outlier values saturate instead of washing out the rest.
function robust(v) { const a = Array.from(v, Math.abs).sort((x, y) => x - y); return a[Math.floor((a.length - 1) * 0.98)] || a[a.length - 1] || 1; }
const scaled = v => { const s = robust(v) || 1; return v.map(x => x / s); };
const showTok = s => (s === '' ? '∅' : s.replace(/ /g, '·').replace(/\n/g, '↵'));
const f3 = x => (Math.abs(x) >= 100 ? x.toFixed(0) : Math.abs(x) >= 10 ? x.toFixed(1) : x.toFixed(3));

// ---------- scene ----------
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(0x0e1218);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.5, 3000);
scene.add(new THREE.AmbientLight(0xffffff, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.8); sun.position.set(-30, 50, 80); scene.add(sun);

const C3 = hex => { const c = new THREE.Color(hex); return [c.r, c.g, c.b]; };
const NEUTRAL = C3('#29313d'), POS = C3('#f29e38'), NEG = C3('#4f9fe0'), DOCK = C3('#ec5c9e'), UNDOCK = C3('#3a4352'),
      MARK = C3('#aab3c0'), SEL = C3('#ffffff'), SLAB = C3('#262e3a');
function valColor(t) {          // t = value / colour scale; beyond ±1 saturates
  const a = Math.pow(Math.min(1, Math.abs(t)), 0.7), tg = t >= 0 ? POS : NEG;
  return [NEUTRAL[0] + (tg[0] - NEUTRAL[0]) * a, NEUTRAL[1] + (tg[1] - NEUTRAL[1]) * a, NEUTRAL[2] + (tg[2] - NEUTRAL[2]) * a];
}
const headColor = h => { const c = new THREE.Color().setHSL(h / 9, 0.7, 0.62); return [c.r, c.g, c.b]; };

const STAG_W = 0.12, STAG = Float32Array.from({ length: 576 }, (_, i) => (i / 575) * (1 - STAG_W));
let glow = null;     // { t0, ms, n }: the counting pass over the stream (read by Group.write, so declared before any group)
let play = null;     // a part played as a sequence of stages: { s, ph, stages, i, t }
let camDur = 700;
// The animation clock. It can stand still (pause, scrub, stage-stepping), so every animation reads vnow(), never the
// wall clock; only the flow-arrow pulses and the line fade keep wall time.
let vbase = 0, vreal = performance.now(), paused = false;
const vnow = () => vbase + (paused ? 0 : performance.now() - vreal);
function setPaused(p) { if (p === paused) return; vbase = vnow(); vreal = performance.now(); paused = p; dirty = true; }
let selIdx = -1;     // tracked position (0..575), or -1
class Group {
  constructor(n, size) {
    this.n = n; this.size = size; this.vals = new Float32Array(n);     // vals: the number printed on each cube
    this.mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(size, size, size), new THREE.MeshLambertMaterial({ color: 0xffffff }), n);
    this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.mesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(n * 3), 3);
    this.mesh.frustumCulled = false;
    for (const k of ['cur', 'from', 'to']) this[k] = { p: new Float32Array(n * 3), s: new Float32Array(n * 3), c: new Float32Array(n * 3) };
    this.t0 = 0; this.dur = 0; this.anim = false;
    scene.add(this.mesh);
  }
  set(i, p, s, c) {           // target for instance i; s = scalar or [sx, sy, sz]; c = [r, g, b] or null (keep)
    const T = this.to, j = i * 3;
    T.p[j] = p[0]; T.p[j + 1] = p[1]; T.p[j + 2] = p[2];
    if (typeof s === 'number') { T.s[j] = T.s[j + 1] = T.s[j + 2] = s; } else { T.s[j] = s[0]; T.s[j + 1] = s[1]; T.s[j + 2] = s[2]; }
    if (c) { T.c[j] = c[0]; T.c[j + 1] = c[1]; T.c[j + 2] = c[2]; }
  }
  hideAll() { this.to.s.fill(0); }
  begin(dur, now, stag = null, back = false) {   // stag: per-instance start (0..1-STAG_W of dur); back: overshoot, a "pop"
    this.from.p.set(this.cur.p); this.from.s.set(this.cur.s); this.from.c.set(this.cur.c);
    this.t0 = now; this.dur = dur; this.anim = true; this.stag = stag; this.back = back; this.lastNow = -1;
  }
  step(now) {
    if (!this.anim || now === this.lastNow) return false;     // a paused clock: nothing to recompute
    this.lastNow = now;
    let k = this.dur > 0 ? (now - this.t0) / this.dur : 1;
    if (k >= 1) { k = 1; this.anim = false; }
    const ease = this.back ? u => 1 + 2.70158 * Math.pow(u - 1, 3) + 1.70158 * Math.pow(u - 1, 2)
      : u => (u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2);
    const e0 = ease(k);
    for (let i = 0; i < this.n; i++) {
      const e = this.stag ? ease(Math.min(1, Math.max(0, (k - this.stag[i]) / STAG_W))) : e0;
      for (const f of ['p', 's', 'c']) {
        const a = this.from[f], b = this.to[f], c = this.cur[f];

    const x = ((v3.x + 1) / 2) * Wd, y = ((1 - v3.y) / 2) * H;
    if (y > limitY || y < topH) continue;
    const txt = g === G.CH ? fmtH(g.vals[i]) : f3(g.vals[i]);

    nctx.font = `700 ${fs.toFixed(0)}px "JetBrains Mono", ui-monospace, monospace`; lastFont = '';
    if (fit < 9) {

    wp.set(g.cur.p[j], g.cur.p[j + 1] + g.size * 0.9, g.cur.p[j + 2] + (g.cur.s[j + 2] * g.size) * 0.75);

    if (v3.z > 1 || Math.abs(v3.x) > 1.05 || Math.abs(v3.y) > 1.05) continue;
    const x = ((v3.x + 1) / 2) * Wd, y = ((1 - v3.y) / 2) * H;
