<meta charset="utf-8">
<title>Petri Dish</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: full-bleed 3D canvas (one deliberate dark "lab bench" look); a slim top bar and a bottom control sheet float over it. */
:root {
  color-scheme: dark;
  --bg: #0e1218; --panel: rgba(20, 26, 35, 0.92); --line: #2a3442; --fg: #e4e8ee; --muted: #8b96a6;
  --pos: #f29e38; --neg: #4f9fe0; --dock: #ec5c9e; --accent: #ec5c9e;
  --display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
  --body: "Inter", ui-sans-serif, system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--body); overflow: hidden; }
#app { position: fixed; inset: 0; }
#c, #num { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#c { touch-action: none; }
#num, #labels { pointer-events: none; }
#labels { position: absolute; inset: 0; }
.lbl { position: absolute; transform: translate(-50%, -100%); font: 500 12px var(--display); color: var(--muted);
  white-space: nowrap; letter-spacing: 0.02em; text-shadow: 0 1px 3px var(--bg); }
.lbl.hot { color: var(--fg); }
header#top { position: absolute; top: 0; left: 0; right: 0; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px); padding-bottom: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(var(--bg), rgba(14, 18, 24, 0)); }
.brand { font: 600 17px var(--display); letter-spacing: 0.01em; }
.brand small { font: 400 12px var(--mono); color: var(--muted); margin-left: 6px; }
select, input[type=text], button { font: 500 13px var(--body); color: var(--fg); background: #1a212c; border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 10px; }
button { cursor: pointer; }
button:hover { border-color: var(--muted); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
#custom { min-width: 0; flex: 1 1 220px; }
#numbers[aria-pressed="true"], #flow[aria-pressed="true"] { border-color: var(--accent); }
#status { font: 12px var(--mono); color: var(--muted); }
#status.err { color: var(--pos); }
section#panel { position: absolute; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line);
  padding-top: 8px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 8px; backdrop-filter: blur(6px);
  /* Expanded on a phone it can be taller than the screen; the page itself never scrolls, so the panel does. */
  max-height: 75vh; max-height: 75dvh; overflow-y: auto; overscroll-behavior: contain; }
#tokens { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.tok { flex: none; font: 12px var(--mono); padding: 3px 6px; border-radius: 4px; background: #1a212c; border: 1px solid var(--line); color: var(--fg); }
.tok.after { opacity: 0.35; }
.tok.sel { border-color: var(--accent); color: #fff; background: #3a1f2e; }
.ctrl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
/* Progress through the current step, like a video bar: one segment per part (chapters), drag to scrub. */
#seekRow { display: flex; align-items: center; gap: 10px; }
#seek { position: relative; flex: 1; height: 20px; cursor: pointer; touch-action: none; }
#seekSegs { position: absolute; left: 0; right: 0; top: 8px; height: 4px; display: flex; gap: 3px; transition: top 0.1s, height 0.1s; }
#seek:hover #seekSegs, #seek.drag #seekSegs { top: 7px; height: 6px; }
.sg { position: relative; flex: 1 1 0; min-width: 4px; background: rgba(255, 255, 255, 0.2); border-radius: 1px; overflow: hidden; }
.sg i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--accent); }
#seekThumb { position: absolute; top: 4px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--accent);
  pointer-events: none; transform: scale(0.8); transition: transform 0.1s; }
#seek:hover #seekThumb, #seek.drag #seekThumb { transform: scale(1.1); }
#seekTip { position: absolute; bottom: 22px; transform: translateX(-50%); font: 11px var(--mono); background: #1a212c; color: var(--fg);
  border: 1px solid var(--line); padding: 2px 6px; border-radius: 4px; white-space: nowrap; pointer-events: none; }
#seekTime { font-size: 11px; color: var(--muted); min-width: 7.5em; text-align: right; }
.ctrl .grp { display: flex; gap: 6px; align-items: center; }
#layer { width: min(260px, 40vw); accent-color: var(--accent); }
.num { font: 13px var(--mono); font-variant-numeric: tabular-nums; min-width: 2.2em; display: inline-block; }
#steps { display: flex; gap: 4px; flex-wrap: wrap; }
#steps button { padding: 4px 7px; font: 11px var(--mono); }
#steps button.on, #headPick button.on { border-color: var(--accent); color: #fff; background: #3a1f2e; }
.info { display: grid; gap: 4px; max-width: 72ch; }
.info h2 { margin: 0; font: 600 15px var(--display); text-wrap: balance; }
#plain { margin: 0; color: var(--fg); font-size: 14px; }
#tech { margin: 0; color: #aab3c0; font-size: 12px; }
#tech::before { content: "Technical: "; color: var(--muted); font-weight: 500; }
#headPick { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
#headPick button { padding: 3px 7px; font: 11px var(--mono); }
#stats { font: 12px/1.5 var(--mono); color: var(--fg); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
#stats b { color: var(--dock); font-weight: 400; }
#stats .ok { color: #7fd18b; }
#tip { position: absolute; pointer-events: none; font: 12px var(--mono); background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 8px; max-width: 260px; }
details#about { font-size: 12px; color: var(--muted); }
details#about summary { cursor: pointer; }
details#about div { max-width: 72ch; padding-top: 4px; display: grid; gap: 3px; }
#panel.compact #tech, #panel.compact #about { display: none; }
#panel.compact .info h2 { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#panel.compact #plain { font-size: 13px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
#panel.compact #stats { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
#track { font: 12px/1.5 var(--mono); color: var(--fg); background: #2a2230; border: 1px solid var(--accent); border-radius: 6px; padding: 4px 8px; }
#track .dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; background: #fff0f8; box-shadow: 0 0 6px var(--accent); margin-right: 6px; vertical-align: 0; }
#track button { padding: 0 6px; margin-left: 6px; font-size: 12px; float: right; }
#track ol.steps { margin: 4px 0 0; padding-left: 22px; }
#track ol.steps li { padding: 2px 4px; border-radius: 4px; color: var(--muted, #aaa); }
#track ol.steps li.now { background: #3a2a40; color: var(--fg); }
#track ol.steps .sn { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; opacity: .75; }
#track ol.steps b { color: #fff0f8; }
#track ol.steps i { display: block; font-style: normal; font-size: 11px; opacity: .65; }
@media (max-width: 640px) {
  .brand small { display: none; }
  .brand { font-size: 15px; }
  header#top { gap: 6px 8px; padding-top: calc(env(safe-area-inset-top, 0px) + 6px); padding-bottom: 4px; }
  header#top select, header#top button { padding: 4px 8px; }
  #status.ok { display: none; }
  section#panel { gap: 6px; padding-top: 6px; }
  .ctrl { gap: 6px 8px; }
  .ctrl button { padding: 4px 9px; }
  #steps button { padding: 3px 6px; }
  #layer { width: 34vw; }
}
</style>

<div id="app">
  <canvas id="c" aria-label="3D view of one transformer layer"></canvas>
  <canvas id="num" aria-hidden="true"></canvas>
  <div id="labels"></div>
  <div id="tip" hidden></div>
  <header id="top">
    <div class="brand">Petri Dish<small>SmolLM2-135M · docking</small></div>
    <select id="prompt" aria-label="Sample prompt"></select>
    <input id="custom" class="live-only" type="text" placeholder="Trace your own prompt (live only)" hidden>
    <button id="run" class="live-only" hidden>Trace</button>
    <button id="overview" title="Show the whole layer">Whole layer</button>
    <button id="numbers" aria-pressed="true" title="Print values on cubes large enough to read; zoom in to see more">Numbers</button>
    <button id="flow" aria-pressed="true" title="Arrows showing which way values move in this step">Flow</button>
    <span id="status">loading…</span>
  </header>
  <section id="panel">
    <div id="tokens" role="listbox" aria-label="Token to follow"></div>
    <div id="seekRow">
      <div id="seek" role="slider" aria-label="Position in this step: drag to scrub; , and . step one stage" tabindex="0">
        <div id="seekSegs"></div><div id="seekThumb"></div><div id="seekTip" hidden></div>
      </div>
      <span id="seekTime" class="num">0:00 / 0:00</span>
    </div>
    <div class="ctrl">
      <div class="grp">
        <button id="prev" aria-label="Previous step">◀</button>
        <button id="play" aria-label="Play">Play</button>
        <button id="next" aria-label="Next step">▶</button>
        <button id="detail" aria-expanded="true" aria-controls="panel">Less</button>
      </div>
      <div class="grp"><label for="layer">Layer</label><input id="layer" type="range" min="0" max="29" value="0"><span class="num" id="layerNum">1/30</span></div>
      <div id="steps"></div>
    </div>
    <div class="info">
      <h2 id="stepTitle"></h2>
      <p id="plain"></p>
      <div id="headPick" hidden></div>
      <div id="track" hidden></div>
      <div id="stats"></div>
      <p id="tech"></p>
    </div>
    <details id="about">
      <summary>About this trace</summary>
      <div id="aboutBody"></div>
    </details>
  </section>
</div>

function resetView() { theta = -0.42; phi = 0.2; zoom = 1; pan.set(0, 0, 0); dirty = true; }
canvas.addEventListener('contextmenu', e => e.preventDefault());

function setSel(i) { selIdx = i; for (const g of Object.values(G)) g.write(); dirty = true; renderUI(); }
const ray = new THREE.Raycaster();
const PICK = { R: 'stream', Q: 'question', K: 'label (key)', V: 'content (value)', F: 'detectors\' answer', NS: 'sum', SA: 'left of the pair', SB: 'right of the pair',
  CH: 'value', CF: 'slot', B0: 'twin (copy of the stream)', P0: 'square', A1: 'stream', B1: 'knob', P1: 'after the knob', A2: 'after the knob',
  B2: 'learned multiplier', P2: 'after the multiplier', A3: 'after the multiplier', B3: 'weight', P3: 'number × weight', S0: 'slot', S1: 'slot', S2: 'slot', S3: 'slot' };

    // grow into bars, so a stale sphere missed the sides of columns. Recompute it on every tap.
    g.mesh.computeBoundingSphere();
    for (const hit of ray.intersectObject(g.mesh)) {
      if (g.cur.s[hit.instanceId * 3] < 0.2) continue;

        const j = i * 3;

  if (name === 'B') {

    txt = `block ${i}: ${fmtPct(tr.a.bshare[o] / 255)} of the detectors' output · ${tr.a.bdock[o] ? 'docked' : 'not docked'} · ${tr.a.bunits[o]}/32 of its detectors in the single-detector set`;
  } else if (name === 'TK') {
    let w = '';
    if (i <= t) w = ' · attention from each question block: ' + Array.from({ length: 9 }, (_, h) => (tr.a.att[((l * 9 + h) * T + t) * T + i] / 255).toFixed(2)).join(' ');
    txt = `token ${i} “${showTok(tr.h.tokens[i])}”${i > t ? ' (later: not visible to this token)' : w}`;
  } else if (name === 'Q' && STEPS[step].key !== 'concat' && STEPS[step].key !== 'add') {
    txt = `${PICK.Q} block ${Math.floor(i / 64)}, number ${i % 64} = ${f3(g.vals[i])}`;
  } else if (name === 'K' || name === 'V') {
    const gi = Math.floor(i / 64);
    txt = `${PICK[name]} block ${gi} (shared by question blocks ${gi * 3}–${gi * 3 + 2}), number ${i % 64} = ${f3(g.vals[i])}`;
  } else txt = `${PICK[name] || 'value'} #${i} = ${f3(g.vals[i])}`;
  tip.textContent = txt; tip.hidden = false;

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); dirty = true;
}
addEventListener('resize', resize);
const v3 = new THREE.Vector3();
function frame(real) {
  const now = vnow();                  // animation time: stands still while paused

  if (updatePulses(real)) dirty = true;
  if (play && !play.done && now >= play.t) { if (play.i + 1 < play.stages.length) { play.i++; runStage(now - play.t); } else play.done = true; }
  updateSeek();
  if (merge && merge.n < 576) {   // count the cubes that have arrived in the holder (same timing as Group.step's stagger)
    const u = (now - merge.t0) / MERGE_MS, n = Math.max(0, Math.min(576, Math.floor(((u - STAG_W) / (1 - STAG_W)) * 575) + 1));
    if (n !== merge.n) { merge.n = n; merge.g.vals[merge.idx] = merge.cum[n]; dirty = true; }
  }
  if (glow) {                     // the counting pass: the band moves over the stream, the counter cube counts along
    const u = Math.min(1, (now - glow.t0) / glow.ms), n = Math.round(u * 576);
    if (n !== glow.n) { glow.n = n; G.CH.vals[2] = n; G.R.write(); dirty = true; }
    if (u >= 1) { glow = null; G.R.write(); }
  }

  if (dirty) {

    const vf = THREE.MathUtils.degToRad(camera.fov) / 2, hf = Math.atan(Math.tan(vf) * camera.aspect);
    const dist = Math.max(camCur[1] / 2 / Math.tan(hf), (camCur[3] / 2 / Math.tan(vf)) * (H / visH)) * zoom;
    lastDist = dist;

      if (v3.z > 1) { L.el.style.display = 'none'; continue; }

      L.el.style.display = ''; L.el.style.left = ((v3.x + 1) / 2) * Wd + 'px'; L.el.style.top = ((1 - v3.y) / 2) * H + 'px';

}

// ---------- numbers on the cubes: a 2D layer over the scene, only for cubes large enough to read ----------
const numCv = $('#num'), nctx = numCv.getContext('2d'), wp = new THREE.Vector3();
let numbersOn = true, lastFont = '';
const fmtV = v => { const a = Math.abs(v); return a >= 100 ? v.toFixed(0) : a >= 10 ? v.toFixed(1) : v.toFixed(2); };
function drawNumbers(H, panelH, topH, vf) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2), Wd = canvas.clientWidth;
  if (numCv.width !== Math.round(Wd * dpr) || numCv.height !== Math.round(H * dpr)) { numCv.width = Math.round(Wd * dpr); numCv.height = Math.round(H * dpr); lastFont = ''; }
  nctx.setTransform(dpr, 0, 0, dpr, 0, 0); nctx.clearRect(0, 0, Wd, H);

  for (const [g, unit] of [[G.R, ''], [G.Q, ''], [G.K, ''], [G.V, ''], [G.F, ''], [G.B, '%'], [G.SA, ''], [G.SB, ''], ...ROW_GROUPS.map(g => [g, ''])]) {
    const P = g.cur.p, S = g.cur.s, Cc = g.cur.c;
    for (let i = 0; i < g.n; i++) {
      const j = i * 3;
      if (S[j] < 0.6) continue;
      wp.set(P[j], P[j + 1], P[j + 2] + (S[j + 2] * g.size) / 2 + 0.01);      // centre of the front face
      const px = (g.size * S[j] * k) / wp.distanceTo(camera.position);       // cube width on screen
      if (px < 24) continue;
      v3.copy(wp).project(camera);
      if (v3.z > 1 || Math.abs(v3.x) > 1.05 || Math.abs(v3.y) > 1.05) continue;
      const x = ((v3.x + 1) / 2) * Wd, y = ((1 - v3.y) / 2) * H;
      if (y > limitY || y < topH) continue;                                   // keep clear of the top bar and the panel
      const txt = fmtV(g.vals[i]) + unit;
      const fs = Math.min((px * 0.9) / Math.max(txt.length * 0.6, 2.4), px * 0.42);
      if (fs < 7) continue;
      const font = `${fs.toFixed(0)}px "JetBrains Mono", ui-monospace, monospace`;
      if (font !== lastFont) { nctx.font = font; lastFont = font; }
      nctx.fillStyle = 0.299 * Cc[j] + 0.587 * Cc[j + 1] + 0.114 * Cc[j + 2] > 0.45 ? '#111418' : '#f2f4f7';
      nctx.globalAlpha = selIdx >= 0 && !(g.linked && i === selIdx) ? 0.3 : 1;   // tracking dims the other numbers
      nctx.fillText(txt, x, y);
    }
  }
  nctx.globalAlpha = 1;
  // The tracked position: a label above its cube in every linked group, readable at any zoom.
  // Value holders (the knob chain, the sum, its partner): the number on the cube's face, sized to the cube; a tag
  // only when the cube is too small on screen to hold it. Counts along during a merge.
  const holders = [...Array.from({ length: 9 }, (_, i) => [G.CH, i]), [G.NS, 0], [G.NS, 1]];
  for (const [g, i] of holders) {
    const j = i * 3;
    if (g.cur.s[j] < 0.5) continue;
    wp.set(g.cur.p[j], g.cur.p[j + 1], g.cur.p[j + 2] + (g.cur.s[j + 2] * g.size) / 2 + 0.01);
    const px = (g.size * g.cur.s[j] * k) / wp.distanceTo(camera.position);
    v3.copy(wp).project(camera);
    if (v3.z > 1 || Math.abs(v3.x) > 1.05 || Math.abs(v3.y) > 1.05) continue;
    const x = ((v3.x + 1) / 2) * Wd, y = ((1 - v3.y) / 2) * H;

      nctx.fillStyle = 'rgba(255, 215, 106, 0.96)'; nctx.beginPath(); nctx.roundRect(x - w / 2, y - fs / 2 - 3, w, fs + 6, 4); nctx.fill();
    }

  }
  if (selIdx >= 0) for (const g of [G.R, G.Q, G.F, G.SA, G.SB, ...ROW_GROUPS]) {
    const j = selIdx * 3;
    if (g.cur.s[j] < 0.3) continue;
    wp.set(g.cur.p[j], g.cur.p[j + 1] + g.size * 0.9, g.cur.p[j + 2] + (g.cur.s[j + 2] * g.size) * 0.75);
    v3.copy(wp).project(camera);
    if (v3.z > 1 || Math.abs(v3.x) > 1.05 || Math.abs(v3.y) > 1.05) continue;
    const x = ((v3.x + 1) / 2) * Wd, y = ((1 - v3.y) / 2) * H;
    if (y > limitY || y < topH) continue;
    const txt = f3(g.vals[selIdx]);
    nctx.font = '600 12px "JetBrains Mono", ui-monospace, monospace'; lastFont = '';
    const w = nctx.measureText(txt).width + 12;
    nctx.fillStyle = 'rgba(42, 34, 48, 0.94)'; nctx.strokeStyle = '#ec5c9e'; nctx.lineWidth = 1;
    nctx.beginPath(); nctx.roundRect(x - w / 2, y - 20, w, 18, 4); nctx.fill(); nctx.stroke();
    nctx.fillStyle = '#ffffff'; nctx.fillText(txt, x, y - 11);
  }
}
$('#numbers').onclick = () => { numbersOn = !numbersOn; $('#numbers').setAttribute('aria-pressed', numbersOn); dirty = true; };
$('#flow').onclick = () => { flowOn = !flowOn; $('#flow').setAttribute('aria-pressed', flowOn); if (tr) setFlows(flowsFor(step, phase)); dirty = true; };

setCompact(matchMedia('(max-width: 640px)').matches);
